spring:
  datasource:
    url: ${DATABASE_URL}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
    open-in-view: false

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

jwt:
  secret: ${JWT_SECRET}
  access-expiry: 3600
  refresh-expiry: 604800

resend:
  api-key: ${RESEND_API_KEY:}
  from: ${EMAIL_FROM:onboarding@resend.dev}

email:
  # true면 Resend 호출을 건너뛰고 인증 코드를 로그에 출력 (로컬/데모 용도). 프로덕션에서는 반드시 false.
  mock: ${EMAIL_MOCK:false}

app:
  url: ${APP_URL:http://localhost:3000}
  admin-emails: ${ADMIN_NOTIFICATION_EMAILS:}

admin:
  # 부트스트랩 ADMIN 계정. email+password 둘 다 세팅되어 있고 DB에 해당 이메일의 멤버가 없으면 기동 시 1회 생성.
  bootstrap:
    email: ${ADMIN_BOOTSTRAP_EMAIL:}
    password: ${ADMIN_BOOTSTRAP_PASSWORD:}
    name: ${ADMIN_BOOTSTRAP_NAME:Admin}

cors:
  allowed-origins: ${CORS_ORIGINS:http://localhost:3000}

sentry:
  dsn: ${SENTRY_DSN:}
  environment: ${SENTRY_ENV:local}
  traces-sample-rate: 0.1
  send-default-pii: false
  exception-resolver-order: -2147483647
  logging:
    minimum-event-level: error
