spring:
  datasource:
    url: ${DATABASE_URL}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
    open-in-view: false

server:
  port: ${PORT:8080}

jwt:
  secret: ${JWT_SECRET}
  access-expiry: 3600
  refresh-expiry: 604800

resend:
  api-key: ${RESEND_API_KEY:}
  from: ${EMAIL_FROM:onboarding@resend.dev}

app:
  url: ${APP_URL:http://localhost:3000}
  admin-emails: ${ADMIN_NOTIFICATION_EMAILS:}

cors:
  allowed-origins: ${CORS_ORIGINS:http://localhost:3000}

sentry:
  dsn: ${https://41aa852c8ca45e1a7635c67a3b35849d@o4511213185204224.ingest.us.sentry.io/4511259081834496}
  environment: ${SENTRY_ENV:production}
  traces-sample-rate: 0.1    # 10% 트랜잭션만 샘플링 (무료 한도 절약)
  send-default-pii: false    # 개인정보(IP, 이메일) 전송 금지
  exception-resolver-order: -2147483647
  logging:
    minimum-event-level: error  # ERROR 로그만 Sentry 전송
