spring:
  datasource:
    url: ${DATABASE_URL}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:false}
    validate-on-migrate: true

server:
  port: ${PORT:8080}
  # Railway/리버스 프록시 뒤에서만 X-Forwarded-* 헤더를 신뢰해 request.getRemoteAddr()가 실제 클라이언트 IP를 반환.
  # 직접 노출 환경에서는 공격자가 헤더를 위조할 수 있으므로 FORWARD_HEADERS_STRATEGY=none 으로 끌 것.
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:native}
  tomcat:
    # files.max-size-bytes 와 동일값. 413 반환 전에 Tomcat 이 요청을 삼키는 크기 상한 — 이보다 큰 본문은 바로 연결이 끊긴다.
    max-swallow-size: ${FILES_MAX_SIZE_BYTES:524288000}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

jwt:
  secret: ${JWT_SECRET}
  access-expiry: 3600
  refresh-expiry: 604800
  issuer: ${JWT_ISSUER:viralground-api}
  audience: ${JWT_AUDIENCE:viralground-web}

auth:
  cookie:
    # 로컬 HTTP에서는 false, 운영 HTTPS에서는 ProductionSafetyValidator가 true를 강제한다.
    secure: ${AUTH_COOKIE_SECURE:false}
    # 프론트와 API가 서로 다른 서브도메인이면 예: .viralground.kr
    domain: ${AUTH_COOKIE_DOMAIN:}
    same-site: ${AUTH_COOKIE_SAME_SITE:Lax}

legal:
  documents:
    # 표시 문서가 바뀔 때 기존 값을 덮어쓰지 말고 새 immutable version ID를 발급한다.
    # 운영에서는 ProductionSafetyValidator가 blank/draft/placeholder 값을 거부한다.
    terms-version: ${LEGAL_TERMS_VERSION:v1.0-draft}
    privacy-version: ${LEGAL_PRIVACY_VERSION:v1.0-draft}
    age14-version: ${LEGAL_AGE14_VERSION:v1.0-draft}
    creator-third-party-version: ${LEGAL_CREATOR_THIRD_PARTY_VERSION:v1.0-draft}
    marketing-version: ${LEGAL_MARKETING_VERSION:v1.0-draft}
  privacy-officer:
    name: ${PRIVACY_OFFICER_NAME:}
    contact: ${PRIVACY_OFFICER_CONTACT:}

resend:
  api-key: ${RESEND_API_KEY:}
  from: ${EMAIL_FROM:onboarding@resend.dev}

email:
  # true면 Resend 호출을 건너뛴다. 수신자와 인증 코드는 mock에서도 로그에 남기지 않는다.
  mock: ${EMAIL_MOCK:false}

app:
  environment: ${APP_ENV:development}
  url: ${APP_URL:http://localhost:3000}
  admin-emails: ${ADMIN_NOTIFICATION_EMAILS:}

admin:
  # 부트스트랩 ADMIN 계정. email+password 둘 다 세팅되어 있고 DB에 해당 이메일의 멤버가 없으면 기동 시 1회 생성.
  bootstrap:
    email: ${ADMIN_BOOTSTRAP_EMAIL:}
    password: ${ADMIN_BOOTSTRAP_PASSWORD:}
    name: ${ADMIN_BOOTSTRAP_NAME:Admin}

# 로컬 화면 확인용 승인 계정. 명시적으로 켤 때만 생성되며 production 환경에서는 기동을 거부한다.
demo:
  bootstrap:
    enabled: ${DEMO_BOOTSTRAP_ENABLED:false}
    password: ${DEMO_BOOTSTRAP_PASSWORD:}
    creator-email: ${DEMO_CREATOR_EMAIL:creator.demo@viralground.local}
    company-email: ${DEMO_COMPANY_EMAIL:company.demo@viralground.local}

cors:
  allowed-origins: ${CORS_ORIGINS:http://localhost:3000}

instagram:
  # mock은 명시적인 로컬 개발 전용. APP_ENV=production에서는 meta가 아니면 기동 실패.
  provider: ${INSTAGRAM_PROVIDER:mock}
  environment: ${APP_ENV:development}
  sync:
    # 릴스 지표 자동 동기화 cron (Asia/Seoul). 기본 매일 00:00. 12h 등으로 조정 가능.
    cron: ${INSTAGRAM_SYNC_CRON:0 0 0 * * *}
    max-items-per-run: ${INSTAGRAM_SYNC_MAX_ITEMS:200}

meta:
  instagram:
    app-id: ${META_INSTAGRAM_APP_ID:}
    app-secret: ${META_INSTAGRAM_APP_SECRET:}
    redirect-uri: ${META_INSTAGRAM_REDIRECT_URI:http://localhost:8080/instagram/meta/oauth/callback}
    frontend-result-url: ${META_INSTAGRAM_FRONTEND_RESULT_URL:http://localhost:3000/creator/mypage}
    # 32-byte 랜덤 키의 Base64 값. JWT secret과 분리하고 정기 회전 계획을 별도로 운영한다.
    token-encryption-key: ${META_INSTAGRAM_TOKEN_ENCRYPTION_KEY:}
    webhook-verify-token: ${META_INSTAGRAM_WEBHOOK_VERIFY_TOKEN:}
    api-version: ${META_INSTAGRAM_API_VERSION:v25.0}
    authorization-url: ${META_INSTAGRAM_AUTHORIZATION_URL:https://www.instagram.com/oauth/authorize}
    oauth-base-url: ${META_INSTAGRAM_OAUTH_BASE_URL:https://api.instagram.com}
    graph-base-url: ${META_INSTAGRAM_GRAPH_BASE_URL:https://graph.instagram.com}
    scopes: ${META_INSTAGRAM_SCOPES:instagram_business_basic,instagram_business_manage_insights}
    state-ttl: ${META_INSTAGRAM_STATE_TTL:10m}
    connect-timeout: ${META_INSTAGRAM_CONNECT_TIMEOUT:3s}
    read-timeout: ${META_INSTAGRAM_READ_TIMEOUT:8s}
    retry-backoff: ${META_INSTAGRAM_RETRY_BACKOFF:250ms}
    refresh-before-expiry: ${META_INSTAGRAM_REFRESH_BEFORE_EXPIRY:7d}
    max-attempts: ${META_INSTAGRAM_MAX_ATTEMPTS:3}
    media-page-size: ${META_INSTAGRAM_MEDIA_PAGE_SIZE:50}
    max-media-pages: ${META_INSTAGRAM_MAX_MEDIA_PAGES:3}
    webhook-retention-days: ${META_INSTAGRAM_WEBHOOK_RETENTION_DAYS:14}

payments:
  # 관리형 베타는 disabled로 fail-closed. mock은 dev/test profile에서 명시적으로만 사용.
  gateway: ${PAYMENTS_GATEWAY:disabled}

files:
  # 스토리지 구현: local | s3. ProductionSafetyValidator는 운영 local 기동을 차단한다.
  storage: ${FILES_STORAGE:local}
  # 프리사인 URL 베이스. 프록시 뒤에서는 실제 공개 URL 로 교체.
  public-base-url: ${FILES_PUBLIC_BASE_URL:http://localhost:8080}
  max-size-bytes: ${FILES_MAX_SIZE_BYTES:524288000}
  allowed-content-types: video/mp4,video/quicktime,video/webm
  max-image-size-bytes: ${FILES_MAX_IMAGE_SIZE_BYTES:10485760}
  allowed-image-content-types: image/jpeg,image/png,image/webp
  signing-ttl-seconds: ${FILES_SIGNING_TTL:900}
  signing-secret: ${FILES_SIGNING_SECRET:${JWT_SECRET}}
  local:
    directory: ${FILES_LOCAL_DIR:./uploads}
  s3:
    # AWS S3는 endpoint를 비우면 region 기반 공식 endpoint를 사용. R2/MinIO는 HTTPS endpoint 지정.
    endpoint: ${FILES_S3_ENDPOINT:}
    region: ${FILES_S3_REGION:}
    bucket: ${FILES_S3_BUCKET:}
    # static | default-chain. AWS workload identity(IRSA/ECS/EC2)는 default-chain 권장.
    credentials-mode: ${FILES_S3_CREDENTIALS_MODE:static}
    access-key: ${FILES_S3_ACCESS_KEY:}
    secret-key: ${FILES_S3_SECRET_KEY:}
    session-token: ${FILES_S3_SESSION_TOKEN:}
    path-style: ${FILES_S3_PATH_STYLE:true}
    connect-timeout: ${FILES_S3_CONNECT_TIMEOUT:3s}
    read-timeout: ${FILES_S3_READ_TIMEOUT:10s}

sentry:
  dsn: ${SENTRY_DSN:}
  environment: ${SENTRY_ENV:local}
  traces-sample-rate: ${SENTRY_TRACES_SAMPLE_RATE:0.05}
  send-default-pii: false
  exception-resolver-order: -2147483647
  logging:
    minimum-event-level: error

logging:
  structured:
    format:
      console: ${LOG_FORMAT:logstash}
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.viralground.backend: ${LOG_LEVEL_APP:INFO}
