name: Backend CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Validate pre-production automation safety
        shell: bash
        run: |
          bash -n scripts/db/lib/clone_guard.sh scripts/db/lib/http_contract.sh \
            scripts/db/*.sh scripts/db/tests/*.sh \
            scripts/db/tests/psql-*-fixture
          bash scripts/db/tests/evidence-dir-refusal-fixture.sh
          bash scripts/db/tests/evidence-seal-fixture.sh
          bash scripts/db/tests/compatibility-ambient-override-fixture.sh
          bash scripts/db/tests/http-contract-comparison-fixture.sh
          bash scripts/db/tests/sanitized-e2e-before-seal-fixture.sh
          bash scripts/db/tests/sanitized-e2e-safety-fixture.sh
          bash scripts/db/tests/production-readonly-role-safety-fixture.sh
          bash scripts/db/tests/public-schema-allowlist-fixture.sh
          bash scripts/db/tests/provider-restore-binding-fixture.sh
          bash scripts/db/tests/source-snapshot-binding-fixture.sh
          bash scripts/ci/verify-immutable-supply-chain.sh
          docker compose -f compose.local-preprod.yml config >/dev/null

          set +e
          output="$(env \
            PGHOST=prod.example.test PGPORT=5432 PGDATABASE=viralground_prod \
            PGUSER=readonly PGSSLMODE=verify-full CLONE_KIND=exact \
            CLONE_SENTINEL_ID=ci-refusal \
            SOURCE_SNAPSHOT_ID=ci-provider-snapshot \
            CLONE_ALLOWED_HOSTS=prod.example.test \
            CLONE_ALLOWED_DATABASES=viralground_prod \
            PRODUCTION_DB_HOST=prod.example.test \
            PRODUCTION_DB_NAME=viralground_prod \
            RELEASE_ID=ci-production-refusal-test \
            DBOPS_CONFIRMATION=I_ACKNOWLEDGE_THIS_IS_A_DISPOSABLE_CLONE \
            bash scripts/db/preflight-readonly.sh 2>&1)"
          status=$?
          set -e
          test "${status}" -eq 64
          grep -F "REFUSED: target host is the declared production host" <<<"${output}"

          set +e
          output="$(env \
            PGHOST=clone.example.test PGPORT=5432 \
            PGDATABASE='postgresql://redirect.example.test/viralground_exact' \
            PGUSER=clone_migrator PGSSLMODE=verify-full CLONE_KIND=exact \
            CLONE_SENTINEL_ID=ci-conninfo-refusal \
            SOURCE_SNAPSHOT_ID=ci-provider-snapshot \
            CLONE_ALLOWED_HOSTS=clone.example.test \
            CLONE_ALLOWED_DATABASES='postgresql://redirect.example.test/viralground_exact' \
            PRODUCTION_DB_HOST=production.example.test \
            PRODUCTION_DB_NAME=viralground_prod \
            RELEASE_ID=ci-conninfo-refusal-test \
            DBOPS_CONFIRMATION=I_ACKNOWLEDGE_THIS_IS_A_DISPOSABLE_CLONE \
            bash scripts/db/preflight-readonly.sh 2>&1)"
          status=$?
          set -e
          test "${status}" -eq 64
          grep -F "REFUSED: PGDATABASE must be a plain database identifier" <<<"${output}"

          compat_fake_psql_dir="$(mktemp -d)"
          cp scripts/db/tests/psql-role-escalation-fixture "${compat_fake_psql_dir}/psql"
          chmod 700 "${compat_fake_psql_dir}/psql"
          set +e
          output="$(env \
            PATH="${compat_fake_psql_dir}:${PATH}" \
            PGHOST=clone.example.test PGPORT=5432 PGDATABASE=viralground_release_exact \
            PGUSER=clone_migrator PGPASSWORD=synthetic-not-used PGSSLMODE=verify-full \
            CLONE_KIND=exact CLONE_SENTINEL_ID=compatibility-refusal \
            SOURCE_SNAPSHOT_ID=ci-provider-snapshot \
            CLONE_ALLOWED_HOSTS=clone.example.test \
            CLONE_ALLOWED_DATABASES=viralground_release_exact \
            PRODUCTION_DB_HOST=production.example.test PRODUCTION_DB_NAME=viralground_prod \
            RELEASE_ID=ci-compatibility-refusal DBOPS_CONFIRMATION=I_ACKNOWLEDGE_THIS_IS_A_DISPOSABLE_CLONE \
            RC_JAR=missing-rc.jar RC_JAR_SHA256=deadbeef \
            LEGACY_JAR=missing-legacy.jar LEGACY_JAR_SHA256=deadbeef \
            COMPAT_PGUSER=clone_migrator COMPAT_PGPASSWORD=synthetic-not-used \
            COMPAT_LOGIN_EMAIL=compat@example.invalid \
            COMPAT_LOGIN_EMAIL_SHA256=012e646225fb76e0536479294d09db94d0213a67bd2e4c67882b658981686215 \
            COMPAT_LOGIN_PASSWORD=synthetic-password-not-used \
            COMPAT_LOGIN_MEMBER_ID=1 \
            COMPAT_SUCCESS_LOGIN_CONFIRMATION=USE_APPROVED_COMPATIBILITY_ACCOUNT_WITH_TEMP_ONLY_AUTH_WRITES \
            GIT_COMMIT_SHA=69c32fd BUILD_TIME=2026-08-22T01:00:00Z \
            MIGRATION_EVIDENCE_DIR=build/missing-migration-evidence \
            EVIDENCE_DIR=build/ci-compatibility-role-refusal \
            bash scripts/db/verify-exact-backend-compatibility.sh 2>&1)"
          status=$?
          set -e
          test "${status}" -eq 64
          grep -F "REFUSED: COMPAT_PGUSER must be a separate persistent-read-only role" <<<"${output}"
          test ! -e build/ci-compatibility-role-refusal

          set +e
          output="$(env \
            PGHOST=not-production.example.test PGPORT=5432 PGDATABASE=viralground_prod \
            PGUSER=production_audit PGSSLMODE=verify-full PGPASSWORD=synthetic-not-used \
            PRODUCTION_DB_HOST=production.example.test \
            PRODUCTION_DB_NAME=viralground_prod \
            PRODUCTION_READONLY_ROLE=production_audit \
            PRODUCTION_AUDIT_CONFIRMATION=I_ACKNOWLEDGE_PRODUCTION_READ_ONLY_METADATA_AUDIT_ONLY \
            RELEASE_ID=ci-production-refusal-test \
            EVIDENCE_DIR=build/ci-production-refusal \
            bash scripts/db/production-readonly-audit.sh 2>&1)"
          status=$?
          set -e
          test "${status}" -eq 64
          grep -F "REFUSED: target host is not exactly the declared production host" <<<"${output}"

          fake_psql_dir="$(mktemp -d)"
          cp scripts/db/tests/psql-role-escalation-fixture "${fake_psql_dir}/psql"
          chmod 700 "${fake_psql_dir}/psql"
          set +e
          output="$(env \
            PATH="${fake_psql_dir}:${PATH}" \
            PGHOST=production.example.test PGPORT=5432 PGDATABASE=viralground_prod \
            PGUSER=production_audit PGSSLMODE=verify-full PGPASSWORD=synthetic-not-used \
            PRODUCTION_DB_HOST=production.example.test \
            PRODUCTION_DB_NAME=viralground_prod \
            PRODUCTION_READONLY_ROLE=production_audit \
            PRODUCTION_AUDIT_CONFIRMATION=I_ACKNOWLEDGE_PRODUCTION_READ_ONLY_METADATA_AUDIT_ONLY \
            RELEASE_ID=ci-production-role-escalation-refusal-test \
            EVIDENCE_DIR=build/ci-production-role-escalation-refusal \
            bash scripts/db/production-readonly-audit.sh 2>&1)"
          status=$?
          set -e
          test "${status}" -eq 64
          grep -F "set_role_escalation_membership" <<<"${output}"
          grep -F "production role/session safety gate found 1 violations" <<<"${output}"
          test ! -e build/ci-production-role-escalation-refusal/database-metadata.tsv

          set +e
          output="$(env \
            PATH="${fake_psql_dir}:${PATH}" \
            PSQL_FIXTURE_VIOLATION=column_write \
            PGHOST=production.example.test PGPORT=5432 PGDATABASE=viralground_prod \
            PGUSER=production_audit PGSSLMODE=verify-full PGPASSWORD=synthetic-not-used \
            PRODUCTION_DB_HOST=production.example.test \
            PRODUCTION_DB_NAME=viralground_prod \
            PRODUCTION_READONLY_ROLE=production_audit \
            PRODUCTION_AUDIT_CONFIRMATION=I_ACKNOWLEDGE_PRODUCTION_READ_ONLY_METADATA_AUDIT_ONLY \
            RELEASE_ID=ci-production-column-grant-refusal-test \
            EVIDENCE_DIR=build/ci-production-column-grant-refusal \
            bash scripts/db/production-readonly-audit.sh 2>&1)"
          status=$?
          set -e
          test "${status}" -eq 64
          grep -F $'column_write_privilege\t1' <<<"${output}"
          grep -F "production role/session safety gate found 1 violations" <<<"${output}"
          test ! -e build/ci-production-column-grant-refusal/database-metadata.tsv
      - name: Unit tests and production package
        run: ./gradlew clean test bootJar --no-daemon --stacktrace
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-unit-test-reports
          path: |
            build/reports/tests/test/**
            build/test-results/test/**
          if-no-files-found: error
          retention-days: 14

  container-security:
    needs: test-and-package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build immutable release-candidate input
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          push: false
          tags: viralground-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record local image identity
        shell: bash
        run: |
          mkdir -p build/reports/security build/security-input
          docker image inspect viralground-backend:${GITHUB_SHA} \
            --format='{{.Id}}' > build/reports/security/image-id.txt
          printf '%s\n' "${GITHUB_SHA}" > build/reports/security/git-commit.txt
          docker save --output build/security-input/backend-image.tar \
            viralground-backend:${GITHUB_SHA}
          sha256sum build/security-input/backend-image.tar \
            > build/reports/security/backend-image-archive.sha256

          container_id="$(docker create viralground-backend:${GITHUB_SHA})"
          trap 'docker rm -f "${container_id}" >/dev/null 2>&1 || true' EXIT
          docker cp "${container_id}:/app/app.jar" build/security-input/app.jar
          docker rm "${container_id}" >/dev/null
          trap - EXIT

      - name: Generate SPDX JSON SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: viralground-backend:${{ github.sha }}
          format: spdx-json
          output-file: build/reports/security/sbom.spdx.json
          upload-artifact: false

      - name: Scan packaged application dependencies
        id: dependency_scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # v0.33.1
        with:
          scan-type: fs
          scan-ref: build/security-input/app.jar
          scanners: vuln
          format: json
          output: build/reports/security/trivy-dependencies.json
          exit-code: "1"
          ignore-unfixed: "false"
          severity: HIGH,CRITICAL

      - name: Scan complete runtime image
        id: image_scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # v0.33.1
        with:
          image-ref: viralground-backend:${{ github.sha }}
          format: json
          output: build/reports/security/trivy-image.json
          exit-code: "1"
          ignore-unfixed: "false"
          severity: HIGH,CRITICAL

      - name: Upload image security evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-security-${{ github.sha }}
          path: build/reports/security/**
          if-no-files-found: error
          retention-days: 30

      - name: Preserve the exact scanned backend image for authorized promotion
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-image-candidate-${{ github.sha }}
          path: |
            build/security-input/backend-image.tar
            build/reports/security/backend-image-archive.sha256
            build/reports/security/image-id.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Enforce dependency and image vulnerability gates
        if: always()
        shell: bash
        env:
          DEPENDENCY_SCAN_OUTCOME: ${{ steps.dependency_scan.outcome }}
          IMAGE_SCAN_OUTCOME: ${{ steps.image_scan.outcome }}
        run: |
          test "${DEPENDENCY_SCAN_OUTCOME}" = "success"
          test "${IMAGE_SCAN_OUTCOME}" = "success"
